# Delta robot cell configuration.
#
# Every key, its type and its default: modules/settings.py (one place). Unknown keys are
# errors, and a key that moved says where it went. A value being present here is NOT a claim
# that it was measured: tags of the form "open-issues C2" point at the unresolved item in
# doc/open-issues.md that governs the value.
#
# The calibration tools (camera_calibrate.py, calibrate_everything.py) rewrite this file through
# modules/config_io.write_config, which keeps comments and layout. Hand edits are safe.

# PLC endpoints
plc:
  omron: {ip: 192.168.250.1, port: 44818}     # NX1P2, EtherNet/IP (arm + suction)
  siemens: {ip: 192.168.250.2, port: 1502}    # S7-1200, snap7 (belt speed + 4th-DOF rotation)
  # Length of every Omron packet waypoint array. Must equal the PLC DB array size: do not change
  # without updating every downstream array that pads to it.
  interpolar_points: 7

# Realtime robot pose pushed by the Omron program Program_UDP: 12-byte datagrams
# (3 x REAL little-endian: X, Y, Z mm) every ~12 ms. The PLC program sets the destination
# IP (currently 192.168.250.101, so the PC's eno1 must own that address) and the firewall
# must accept UDP to `port` from the PLC. While the stream is fresh the pose comes from it
# and the Omron status block is only re-read every omron_status_period_s; when it goes
# silent, status polling reads the pose over EtherNet/IP as before.
pose_stream:
  enabled: true
  port: 9001                    # local UDP port (PC_Port in Program_UDP)
  stale_s: 0.1                  # a pose older than this falls back to EtherNet/IP polling (s)
  omron_status_period_s: 0.2    # re-read task_state / bit_doing / end_effector this often (s)

# Per-run debug logs: log/<YYYYmmdd-HHMMSS>_<mode>/ with console, commands, status and pose,
# all stamped on time.monotonic() and time.time() (doc/basis-programming.md §2.3).
# `main.py --no-log` skips it for one run.
logging:
  enabled: true
  dir: log                      # relative to the repository root

# The arm: templates, motion model, rotation axis (doc/basis-theory.md §3-§5)
robot:
  # PC-side motion envelope, checked on every goto_absolute / go_trajectory point at
  # the Omron gateway (all senders: scheduler, CLI, web console). Points outside are
  # rejected, never clamped. The console additionally rejects IK / -20° joint-limit failures.
  limits:
    radius_xy_mm: 180.0         # XY reach circle around the robot origin. open-issues G7 (~140 mm IK-valid at clearance)
    z_min_mm: -305.0            # lowest allowed z: 2 mm below the pickup height
    z_max_mm: -220.0            # highest allowed z: above the post-homing calibration pose (z = -230.2)
  home_position: [0.0, 0.0, -290.0]
  # Trajectory template heights, robot frame (mm). Hierarchy: basis-programming.md §4.2.
  heights:
    clearance: -265.0           # travel height between picks. open-issues G7 (joint limit binds here)
    slope_transition: -275.0    # where the slanted approach turns vertical
    pre_pick: -287.0            # park height above the part before the pick phase
    pickup: -303.0              # suction-cup contact height
    place: -280.0               # release height over the bin
  corner_blend_xy: 25.0         # XY corner blend radius of the 7-point template (mm)
  # PLC S-curve trajectory-time model: the scheduler's estimate of every processing time.
  # open-issues C5 (never validated on the real arm — blocking).
  interpolator:
    v_max: 300.0                # mm/s
    a_max: 1000.0               # mm/s^2
    d_max: 1000.0               # mm/s^2
    soft_start_s: 0.08          # PLC State-10 soft start (s)
    scurve_shape_factor: 1.5    # S-curve time stretch over the trapezoid
  # argument_time of every packet: ignored by the Omron firmware, but the pick executor's
  # arrival timeout sums it. Rough constant-velocity ETA — NOT the timing model above.
  packet_time:
    nominal_xy_speed: 220.0     # mm/s
    nominal_z_speed: 220.0      # mm/s
    release_descent_time_s: 0.14  # place-phase descent before the suction is released (s)
  # Post-grip rotation chain (doc/basis-theory.md §5)
  rotation:
    offset_deg: -62.0           # cup marker offset (deg). open-issues C4
    sign: 1                     # +1/-1 axis direction. open-issues C1
    home_tolerance_deg: 0.0     # 0 = strict "axis home at grip" check. open-issues G4
    refresh_max_delta_deg: 15.0 # largest late heading refresh accepted before the pick (deg)

# Conveyor belt and frame transforms (doc/basis-theory.md §1)
conveyor:
  # Real belt feedback (Omron MC_Conveyor Act.Pos / Act.Vel, already in mm via the axis unit
  # conversion) -> true units: multiplies conveyor_position AND speed_current at the PLC
  # worker. 1.0 unless a tape measurement disagrees with the axis' mm/rev. Not applied under
  # --sim / --dummy. open-issues C8.
  position_scale_mm: 1.0
  velocity_ema_alpha: 0.4       # EMA of the belt velocity derived from position; used only when the PLC sends no velocity
  accel_mm_s2: 500.0            # belt ramp = Conv_Acc / Conv_Dec of Section_Conveyor; drives forecasts and the simulator ramp
  hw_max_mm_s: 200.0            # drive hardware maximum (mm/s); the PLC clamps at Conv_Vel_Max = 300
  # C-frame (belt u,v) -> R-frame (robot x,y) rigid transform. open-issues C6: no automated
  # calibration procedure.
  frame:
    theta_deg: 28.0             # rotation of the belt axis in the robot frame (deg)
    robot_origin_uv: [287.0, 93.0]  # robot origin expressed in belt coordinates (mm)
  camera_window_uv: [0.0, 95.0, 0.0, 125.0]       # [u_min, u_max, v_min, v_max] seen by the camera (mm)
  workspace_window_uv: [200.0, 390.0, 0.0, 125.0]  # [u_min, u_max, v_min, v_max] the arm may pick in (mm)

# Part classes: everything about a class in one place. `bin` is the drop position in the robot
# frame [x, y, z] mm; w/h the board footprint (simulator, vision tooling); `marker_class` the
# YOLO class of its orientation marker; `heading_offset_deg` the per-class marker offset
# (open-issues C4); `symmetry_deg` its rotational symmetry. `model_class` (the YOLO class
# name) defaults to the type's own name.
object_types:
  QFP: {bin: [149.65, -13.07, -280.0], w: 30.7, h: 30.7, marker_class: marker_QFP, symmetry_deg: 90, heading_offset_deg: 0.0}
  TQFP: {bin: [116.8, 48.735, -280.0], w: 47.0, h: 38.0, marker_class: marker_TQFP, symmetry_deg: 180, heading_offset_deg: 0.0}

# Vision pipeline: YOLO-OBB inference + PyAV capture (doc/basis-programming.md §2)
vision:
  model_weights: models/nano@1920/weights/best.pt  # YOLO-OBB weights, relative to the repo root
  imgsz: 1920                   # inference image size (px)
  conf: 0.7                     # minimum confidence for a board detection
  conf_marker: 0.55             # minimum confidence for an orientation marker detection
  iou: 0.7                      # NMS IoU threshold
  device: "0"                   # torch device: "0" = first CUDA GPU, "cpu" for CPU (keep quoted)
  half: true                    # FP16 inference
  show_window: true             # open an OpenCV preview window
  capture:
    camera_usb_id: "0c45:636b"  # USB vendor:product used to locate the camera (keep quoted)
    device: null                # explicit /dev/videoN; null = resolve from camera_usb_id
    width: 1920
    height: 1080
    pixelformat: mjpeg          # MJPEG is required for 30 fps at 1080p
    fps: 30
  # Applied verbatim through v4l2 (manual exposure). exposure_time_absolute also feeds the
  # camera-latency back-dating of each detection.
  v4l2_controls:
    exposure_dynamic_framerate: 0
    auto_exposure: 0
    exposure_time_absolute: 100
  pixels_per_mm: 6.1         # image scale (written by camera_calibrate.py)
  latency_offset_s: 0.0         # capture latency beyond the frame's kernel stamp (s); measured by the test_camera_latency scenario
  roi:
    enabled: true               # ignore detections outside the polygon
    polygon: [[549, 192], [1323, 182], [1312, 764], [561, 784]]  # image-space ROI (px)
  trigger_line:
    y_px: 214                   # reference line drawn by camera_calibrate.py
    direction: down             # image direction the belt moves in
    min_conf: 0.6               # confidence a board needs before it is handed to the scheduler
  # Marker-based board heading (doc/basis-theory.md §5); per-class data lives in object_types
  orientation:
    enabled: true
    cross_check: false          # take the board type from its marker instead of the OBB class
    marker_max_dist_mm: 30.0    # a marker farther than this from a board centre is not its marker
  tracker:
    max_match_dist_px: 250      # centroid tracker association radius (px)
    max_missing_frames: 15      # frames a track survives without a detection
  # Informational belt-speed estimate from track motion; the scheduler uses the PLC encoder.
  belt_estimator:
    enabled: true
    ema_alpha: 0.3
    min_track_frames: 3
    axis: y

# Pick gate and pick executor (doc/basis-theory.md §4.4)
pick_gate:
  # Gate -> cup contact latency; their sum is the pick gate's lead offset. Measured 2026-10-02
  # (25 picks, pose stream): command-3 write 0.046 s, PLC receipt -> lowest z 0.182 s
  # (send -> bottom 0.224 +- 0.006 s, plus ~0.004 s gate -> send). `python3 -m modules.tools.pick_timing`.
  robot_movement_delay_s: 0.182
  ethernet_delay_s: 0.046
  pick_descent_time_s: 0.0      # extra gate lead for the vertical descent (s). open-issues T1
  # Fire the gate this much earlier (> 0) or later (< 0) along the belt (mm): an empirical
  # correction of late picks, not a measured latency. open-issues C10.
  gate_offset_mm: 15.0
  late_abort_mm: 12.0           # abort (and re-queue) when the gate fires this late; <= 0 disables
  # Arm-arrival tolerance, linear in belt speed from the floor (at speed.band.min_mm_s) to the
  # ceiling (at speed.band.max_mm_s). open-issues G6 (widened as a symptom treatment).
  arrival_tolerance_mm: 15.0
  arrival_tolerance_max_mm: 50.0
  arrival_timeout_margin_s: 1   # slack on the modelled flight time before a move counts as failed (s)
  oblique_descent_enabled: false  # belt-tracking slanted descent; false = vertical. open-issues C3
  intercept_lead_time_s: 0.8    # minimum time from planning to predicted pick (s)

# Realtime loop timing
runtime:
  poll_interval_s: 0.05         # main-loop / status poll period (s)
  stale_timeout_s: 5.0          # drop a track not re-seen for this long while in camera view (s)
  speed_timeout_s: 1.0          # a belt speed sample older than this blocks planning (s)
  grip_tolerance_mm: 12.7       # outcome record: gripped if the part centre is this close to the cup at contact (open-issues L17)
  flow_bin_s: 10.0              # time bin of the run's flow.csv (s)

# Which object next (modules/scheduling, doc/basis-theory.md §7). `planner` is any registered
# dispatch rule (spt, fifo, edd, least_slack) or sequence planner (kim, kim_release, dp, ...):
# `python3 -m modules.scheduling` lists them. drop_longest is the planner this cell ran as
# "kim" before 2026-09; kim is now Kise-Ibaraki-Mine's single-removal algorithm.
scheduling:
  planner: drop_longest
  safety_margin_s: 0.1          # margin on every deadline (s)
  setup_time_s: 0.064           # per-pick executor overhead: bin arrival -> next goto send, back-to-back median of 88 cycles (2026-10-02)
  # What the speed laws assume about one pick cycle. open-issues G2, C7
  arm_cycle:
    cycle_s: 3                  # calibrated arm cycle t_pick (s). open-issues G2
    # Measured worst cases, 135 hardware pick cycles of 2026-10-02 (picks at u = 188-359 mm), no
    # waiting for the part: grab = goto send -> contact, occupancy = goto send -> bin + setup.
    # The model sweep (python3 -m modules.tools.derive_rank_bounds) gives 1.909 / 3.458 at the far
    # corner u = 390, v = 0, never picked in those runs. With queue_depth_k = 1 and L = 190 mm:
    # v_max = 190 / (2.779 + 1.551) = 43.9 mm/s. open-issues C7
    occupancy_worst_s: 2.4
    grab_worst_s: 1.2

# Which belt speed (modules/scheduling). `law` is any registered speed law (constant,
# inverse_density, predictive_rank, ...); each law's own parameters sit under `laws`.
speed:
  law: constant
  setpoint_gate: null           # when the setpoint may move; null = the law's own default
  static_mm_s: 10.0             # belt speed for `constant`; startup setpoint of the other laws. open-issues G1 (above max)
  control_period_s: 1.0         # re-decide this often while the gate stays open (s)
  band:
    min_mm_s: 5.0              # lower bound for every law (mm/s)
    max_mm_s: 100.0             # operational ceiling for every law (mm/s)
  commit:
    deadband_mm_s: 5.0          # target changes smaller than this are not sent (mm/s)
    max_step_mm_s: 20.0         # largest setpoint change per commit (mm/s)
  laws:
    inverse_density:
      headroom: 0.4             # fraction of arm capacity the law targets
      transit_min_s: 0.6        # minimum residence in the workspace; caps speed at L / this (s)
      density_length_mm: 0.0    # density measurement length; 0 = u_max. open-issues G3
    predictive_rank:
      planner: drop_longest     # planner that scores candidate speeds; null = scheduling.planner
      horizon_s: 45.0           # scoring horizon W (s)
      queue_depth_k: 1          # picks the band must absorb: v_max = L / (k * p + g)
      candidate_step_mm_s: 5.0  # candidate speed grid step (mm/s)

# PLC simulator feeder (main.py --sim)
plc_sim:
  feed_types: [QFP, TQFP]
  feed_lanes: [10.0, 50.0, 90.0]  # spawn lanes (v, mm)

# Virtual parts of the simulate_feeder scenario: the camera is replaced by parts drawn from a
# seed (modules/core/feeders.py, the same feeders as the sandbox) riding the real belt encoder.
feeder:
  kind: poisson                 # script | periodic | poisson | regime | bursty
  seed: 1
  max_parts: 0                  # stop after this many parts; 0 = no limit
  schedule_s: 3600.0            # arrivals drawn for this long when the run has no --duration (s)
  detection_latency_s: 0.011     # capture delay the virtual camera reports (s)
  position_noise_mm: 0.0        # Gaussian noise on each virtual detection (mm)
  kinds:
    periodic: {interval_s: 2.5, types: [QFP, TQFP], lanes: [20.0, 60.0, 100.0]}
    poisson: {rate_per_min: 24.0, types: [QFP, TQFP], lane_band_v: [15.0, 110.0]}
    regime: {nominal_rate_per_min: 24.0, types: [QFP, TQFP], lane_band_v: [15.0, 110.0]}
    bursty: {mean_rate_per_min: 24.0, types: [QFP, TQFP], lane_band_v: [15.0, 110.0]}

# Operator console (main.py --interface)
interface:
  port: 8067                    # HTTP port
  mjpeg_fps: 15                 # camera stream frame rate
  # Teach points: name -> robot frame [x, y, z] (mm). Written by the console's Teach points card
  # (save / delete). "C - <u>, <v>" are the corners of conveyor.workspace_window_uv converted with
  # modules.tools.frame_convert, at pre_pick height.
  teach_points:
    "C - 188, 0": [-31.222, -128.725, -287.0]
    "C - 188, 125": [79.147, -70.041, -287.0]
    "C - 363, 125": [-3.011, 84.474, -287.0]
    "C - 363, 0": [-113.379, 25.791, -287.0]
    home: [0.0, 0.0, -240.0]
