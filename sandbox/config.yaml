# Sandbox run configuration: one simulated run. `python3 -m sandbox run --set key=value`
# overrides any value for one run; `sandbox/experiments/*.yaml` sweep them.
#
# The cell (robot, conveyor, part classes, pick gate) is not here: it lives with the arm model
# in sandbox/models/<arm.model>.yaml. `scheduling:` and `speed:` have exactly the shape of the
# same sections in modules/config.yaml.

sim:
  duration_s: 300.0
  dt_s: 0.005               # belt and arm clock step (s)
  replan_period_s: 0.05     # re-plan period while the arm is free: the robot's poll interval
  seed: 1
  capture_tolerance_mm: 12.7  # the cup grips a part whose centre is this close along the belt
  lost_margin_mm: 30.0
  stall_timeout_s: 10.0

feeder:
  kind: poisson             # script | periodic | poisson | regime | bursty (modules/core/feeders.py)
  poisson:
    rate_per_min: 24.0
    types: [QFP, TQFP]
    lane_band_v: [10.0, 115.0]

arm:
  model: delta              # sandbox/models/delta.yaml or point_mover.yaml
  plant: {}                 # extra dotted overrides for the plant only, e.g. {pick_gate.robot_movement_delay_s: 0.2}

scheduling:
  planner: kim
  safety_margin_s: 0.1
  setup_time_s: 0.0
  arm_cycle:
    cycle_s: 3
    occupancy_worst_s: 3.282
    grab_worst_s: 1.817

speed:
  law: constant
  setpoint_gate: null
  static_mm_s: 60.0
  control_period_s: 1.0
  band: {min_mm_s: 30.0, max_mm_s: 100.0}
  commit: {deadband_mm_s: 5.0, max_step_mm_s: 20.0}
  laws:
    inverse_density: {headroom: 0.4, transit_min_s: 0.6, density_length_mm: 0.0}
    predictive_rank: {planner: null, horizon_s: 45.0, queue_depth_k: 1, candidate_step_mm_s: 5.0}
