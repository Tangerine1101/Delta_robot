# Phase 1 confirmation: three planners, stationary load
# The same 20 settings for dp, KIM and SPT on the confirmation seeds 3001-3010 (not used to choose
# anything), 60 cases x 10 seeds. Paired by seed: every case sees the same arrivals.
# See doc/experiment_notes.md.
kind: sweep
description: "Phase 1 confirmation: three planners, stationary load"
cell_config: modules/config.yaml
base:
  feeder.kind: poisson
  feeder.poisson.rate_per_min: 24
  sim.duration_s: 2800          # 1000 parts arrive by ~2500 s, the rest is the tail
  sim.stacking: true
  scheduling.stack_aware: true
  feeder.max_parts: 1000
  speed.laws.predictive_rank.planner: drop_longest
  scheduling.planners.dp.max_jobs: 16
seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010]
quick: {base: {sim.duration_s: 700, feeder.max_parts: 250}, seeds: [3001, 3002, 3003], cases: [{name: "dp|W=15", set: {scheduling.planner: dp, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 15}}, {name: "dp|W=inf", set: {scheduling.planner: dp, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 1000}}, {name: "dp|c=20", set: {scheduling.planner: dp, speed.law: constant, speed.static_mm_s: 20}}, {name: "dp|c=60", set: {scheduling.planner: dp, speed.law: constant, speed.static_mm_s: 60}}, {name: "kim|W=15", set: {scheduling.planner: kim, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 15}}, {name: "kim|W=inf", set: {scheduling.planner: kim, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 1000}}, {name: "kim|c=20", set: {scheduling.planner: kim, speed.law: constant, speed.static_mm_s: 20}}, {name: "kim|c=60", set: {scheduling.planner: kim, speed.law: constant, speed.static_mm_s: 60}}, {name: "spt|W=15", set: {scheduling.planner: spt, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 15}}, {name: "spt|W=inf", set: {scheduling.planner: spt, speed.law: predictive_rank, speed.laws.predictive_rank.horizon_s: 1000}}, {name: "spt|c=20", set: {scheduling.planner: spt, speed.law: constant, speed.static_mm_s: 20}}, {name: "spt|c=60", set: {scheduling.planner: spt, speed.law: constant, speed.static_mm_s: 60}}]}
