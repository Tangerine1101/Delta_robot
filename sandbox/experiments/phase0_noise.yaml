# Noise floor of the replay. A replay is deterministic, so one sandbox number per cell run says
# nothing about how much of a gap to the cell is the closed loop's scatter. Each cell run is
# replayed seven times with the plant unchanged and only the clock of the simulation shifted by a
# few milliseconds (`sim.dt_s` 4-6 ms, `sim.replan_period_s` 45-55 ms): jitter of the size the
# robot's own poll and the PLC link have. Compare the cell's value with the spread of the seven
# (README, phase 0). W = 50 s (seed 1001) and W = 45 s (seed 110) are the two long-horizon runs
# whose belt gate failed in phase0_replay*.
kind: replay
description: Seven clock-shifted replays of each cell run, to find the closed loop's scatter
gates: {picks_rel: 0.05, belt_rel: 0.10, agree: 0.85}
