# Solve time of dp and predictive_rank
# How long a decision takes, against dp's max_jobs and predictive_rank's candidate step (the
# candidates scored are band / step), with predictive_rank's inner planner either drop_longest (the
# cell) or dp. `cell`: 24 parts/min, W = 20 s. `stress`: regime feeder at nominal 40 parts/min and
# W = inf, which keeps the belt slow and the queue long (up to ~24 parts). 100 cases x 3 seeds,
# 1500 s each. Times are this machine's wall clock; the cell PC's is not measured. The robot's
# budget: a speed decision every 1 s (control_period_s), a planning every 50 ms poll.
# See doc/experiment_notes.md.
kind: sweep
description: "Solve time of dp and predictive_rank"
cell_config: modules/config.yaml
base:
  sim.duration_s: 1500
  sim.stacking: true
  scheduling.stack_aware: true
  scheduling.planner: dp
  speed.law: predictive_rank
seeds: [3001, 3002, 3003]
quick: {base: {sim.duration_s: 400}, seeds: [3001], cases: []}
cases:
  - {name: "cell|drop_longest|mj=8|step=1", set: {feeder.kind: poisson, feeder.poisson.rate_per_min: 24, speed.laws.predictive_rank.horizon_s: 20, scheduling.planners.dp.max_jobs: 8, speed.laws.predictive_rank.candidate_step_mm_s: 1, speed.laws.predictive_rank.planner: drop_longest}}
  - {name: "cell|drop_longest|mj=8|step=2.5", set: {feeder.kind: poisson, feeder.poisson.rate_per_min: 24, speed.laws.predictive_rank.horizon_s: 20, scheduling.planners.dp.max_jobs: 8, speed.laws.predictive_rank.candidate_step_mm_s: 2.5, speed.laws.predictive_rank.planner: drop_longest}}
