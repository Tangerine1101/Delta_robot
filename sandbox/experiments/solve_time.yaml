  - {name: "cell|drop_longest|mj=8|step=10", set: {feeder.kind: poisson, feeder.poisson.rate_per_min: 24, speed.laws.predictive_rank.horizon_s: 20, scheduling.planners.dp.max_jobs: 8, speed.laws.predictive_rank.candidate_step_mm_s: 10, speed.laws.predictive_rank.planner: drop_longest}}
